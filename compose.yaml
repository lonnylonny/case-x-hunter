# CaseTrace 本机运行环境：PostgreSQL（M5 起）与 Answer API（M6-01 起）。
# 宿主 Python（uv）开发路线继续可用；容器路线的权威说明见 docs/development/docker.md。
name: casetrace-dev

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${CASETRACE_POSTGRES_ADMIN_PASSWORD:?Set the admin password in .env}
      CASETRACE_POSTGRES_PASSWORD: ${CASETRACE_POSTGRES_PASSWORD:?Set the app password in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${CASETRACE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$CASETRACE_POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U casetrace -d casetrace_test -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 128mb

  # 每次主入口都显式执行本服务；已有有效快照只核对当前内容，不回填样例。
  prepare:
    image: casetrace-api:dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CASETRACE_CONTAINER: "1"
      CASETRACE_POSTGRES_PASSWORD: ${CASETRACE_POSTGRES_PASSWORD:?Set the app password in .env}
    command: ["python", "-m", "casetrace.storage", "prepare"]

  api:
    build:
      context: .
    image: casetrace-api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
    environment:
      # 由单一应用密码构造容器地址；宿主显式 URL 不注入容器。
      CASETRACE_CONTAINER: "1"
      CASETRACE_POSTGRES_PASSWORD: ${CASETRACE_POSTGRES_PASSWORD:?Set the app password in .env}
      # 模型凭据只在核心确需生成时使用；缺省为空也能构建、启动、导入与 check-only。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:${CASETRACE_API_PORT:-8000}:8000"
    healthcheck:
      # 只证明 HTTP 进程能响应；数据库与模型可用性由导入、verify 和有效请求证明。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
